<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1022"/>
      <stop offset="100%" stop-color="#060b1a"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- abstract icosahedron ring (center) -->
  <g stroke="#f43f5e" stroke-width="1.6" fill="none" opacity="0.9">
    <polygon points="64,18 104,55 84,96 44,96 24,55"/>
    <polygon points="64,18 84,55 104,55 64,18"/>
    <polygon points="84,55 104,55 84,96"/>
    <polygon points="84,96 64,110 44,96"/>
    <polygon points="44,96 24,55 64,55"/>
    <polygon points="24,55 64,18 64,55"/>
  </g>
  <g fill="#4ecdc4">
    <circle cx="64" cy="18" r="3.5"/>
    <circle cx="104" cy="55" r="3.5"/>
    <circle cx="84" cy="96" r="3.5"/>
    <circle cx="44" cy="96" r="3.5"/>
    <circle cx="24" cy="55" r="3.5"/>
    <circle cx="84" cy="55" r="3" fill="#ffd93d"/>
  </g>
  <g fill="#a78bfa">
    <circle cx="64" cy="110" r="3"/>
    <circle cx="64" cy="55" r="3"/>
  </g>
  <!-- center letter -->
  <text x="64" y="72" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="700" font-size="26" fill="#ffffff" letter-spacing="-1">G</text>
  <!-- tiny label -->
  <text x="64" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#8b9fc7">GROUPVIZ</text>
